name: Nightly Build

on:
  push:
    branches:
      - default
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.github/dependabot.yml'

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build nightly APK
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup APK signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            # No secrets configured (a fork, or a fresh clone). Decoding an empty variable
            # would write a 0-byte .jks and kill assembleRelease inside the signing step,
            # so fall back to the key bundled in keystore/ — the same one CI and the
            # release workflow verify against, which every clone can reproduce.
            echo "SIGNING=bundled" >> "$GITHUB_ENV"
          else
            echo -n "$SIGNING_KEY" | base64 -d > app/storeFile.jks
            echo storeFile=storeFile.jks          > custom.properties
            echo storePassword="$KEY_STORE_PASSWORD" >> custom.properties
            echo keyAlias="$ALIAS"    >> custom.properties
            echo keyPassword="$KEY_PASSWORD" >> custom.properties
            echo "SIGNING=custom" >> "$GITHUB_ENV"
          fi

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Build release APK
        # Only pass the properties file when the secret path actually produced one.
        run: |
          if [ "$SIGNING" = "custom" ]; then
            ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties
          else
            ./gradlew assembleRelease
          fi

      - name: Set app version
        run: |
          echo "APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Collect APKs
        env:
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' \
            -exec cp {} release-artifacts/ \;
          # R8 mapping — needed to deobfuscate crash stack traces.
          # The name is unique per commit so nightly builds do not overwrite each other's mapping.
          # Gzipped — 132 MB of text compresses roughly 10x
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "release-artifacts/mapping-${SHORT_SHA}.txt.gz"
          fi
          ls -lah release-artifacts

      - name: Build changelog and move nightly tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin --tags --force

          # Baseline = latest *stable* tag (anything that isn't "nightly").
          # This way the list accumulates across nightly builds and only
          # resets once a real release tag is cut.
          BASE_TAG=$(git tag --sort=-creatordate | grep -v -x 'nightly' | head -n1)

          {
            echo "⚠️ Automated build from the latest commit on the \`$REF_NAME\` branch."
            echo "Commit: $COMMIT_SHA"
            echo "This is not a stable release and may contain bugs."
            echo ""
            echo "🗄️ The database may be migrated (Room). Back up before updating — downgrading to an older build may not work."
            echo ""
            if [ -n "$BASE_TAG" ]; then
              echo "## Changes since $BASE_TAG"
              git log --pretty=format:'- %s (%h)' "$BASE_TAG".."$COMMIT_SHA"
            else
              echo "## Recent changes"
              git log -20 --pretty=format:'- %s (%h)' "$COMMIT_SHA"
            fi
            echo ""
          } > release-body.md

          cat release-body.md

          # Now move the tag to the new commit so source archives stay in sync too
          git tag -f nightly "$COMMIT_SHA"
          git push origin nightly --force

      - name: Delete old nightly APK assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete only the APKs (every run re-uploads them);
          # mapping-<sha>.txt.gz stays — old crashes are decoded with it
          gh release view nightly --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .name' 2>/dev/null | \
            xargs -r -I{} gh release delete-asset nightly "{}" --yes || true

      - name: Create/update nightly release
        uses: softprops/action-gh-release@v3
        with:
          name: Dreamora nightly v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body_path: release-body.md
          files: release-artifacts/*
          # mapping-<sha>.txt.gz (R8) sits next to the APK — for decoding crashes

      - name: Prune old mapping assets (keep last 50)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the 50 newest mapping-<sha>.txt.gz, prune older ones automatically
          gh release view nightly --json assets --jq \
            '(.assets | map(select(.name | test("^mapping-.*\\.txt\\.gz$"))) | sort_by(.createdAt)) as $m
             | ($m | length) as $n
             | if $n > 50 then $m[0:($n - 50)][].name else empty end' 2>/dev/null | \
            xargs -r -I{} gh release delete-asset nightly "{}" --yes || true