name: CI

# Verification gate for the branch: compile every touched module, run the
# extension-compat unit tests (fatal — these are the tests that pin the JSON index
# formats), then assemble a debug APK signed with the repo key and keep it as an
# artifact.
#
# Runner logs are not reachable from every tool, so each gradle step also publishes
# its errors as check annotations (::error::) — `gh api .../check-runs/<id>/annotations`
# or the Checks UI shows the exact file:line of every failure.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: ''
        type: string

permissions:
  # write only so the failure path can publish the raw log to the `ci-log` branch
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile + tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # A developer's org.gradle.java.home does not exist on the runner.
      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Check the signing key
        # Not fatal: a missing key only means the debug certificate is used instead.
        run: |
          if [ -f keystore/novela-release.p12 ]; then
            echo "keystore: present"
            openssl pkcs12 -in keystore/novela-release.p12 -passin pass: -nokeys -noout -info
          else
            echo "keystore: MISSING — falling back to the debug certificate"
          fi

      - name: Compile every touched module
        run: |
          set -o pipefail
          ./gradlew \
            :tooling:extension_compat:compileDebugKotlin \
            :features:extensions:compileDebugKotlin \
            :features:catalogExplorer:compileDebugKotlin \
            :features:settings:compileDebugKotlin \
            :app:compileDebugKotlin \
            --stacktrace --console=plain --continue 2>&1 | tee -a "$RUNNER_TEMP/build-output.log"

      - name: Unit tests (extension compat layer)
        run: |
          set -o pipefail
          ./gradlew :tooling:extension_compat:testDebugUnitTest \
            --stacktrace --console=plain --continue 2>&1 | tee -a "$RUNNER_TEMP/build-output.log"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee -a "$RUNNER_TEMP/build-output.log"

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -20

      - name: Publish errors as annotations
        # The Checks API caps a run at 50 annotations, so errors are grouped per file
        # (5 each) instead of dumping the first 50 lines of one module.
        if: always()
        run: |
          LOG="$RUNNER_TEMP/build-output.log"
          [ -f "$LOG" ] || { echo "no build log"; exit 0; }
          python3 - "$LOG" <<'PYEOF'
          import re, sys, os, collections
          log = open(sys.argv[1], errors="ignore").read().splitlines()
          by_file = collections.OrderedDict()
          tests = []
          for line in log:
              m = re.match(r"^\s*(?:e|error): (?:file://)?(\S+?):(\d+):\d+[: ]+ (.*)$", line)
              if m:
                  path, ln, msg = m.group(1), m.group(2), m.group(3)
                  path = path.replace(f"{os.environ.get('GITHUB_WORKSPACE', '')}/", "")
                  by_file.setdefault(path, []).append((ln, msg))
                  continue
              if re.search(r"FAILED$|tests? completed", line):
                  tests.append(line.strip())
              if line.startswith("* What went wrong"):
                  idx = log.index(line)
                  for extra in log[idx + 1: idx + 8]:
                      if extra.startswith("* Try:") or extra.startswith("* Get more"):
                          break
                      if extra.strip():
                          tests.append(extra.strip())
          emitted = 0
          for path, errs in by_file.items():
              for ln, msg in errs[:5]:
                  msg = msg.replace("%", "%25").replace("\r", " ").replace("\n", " ")[:400]
                  print(f"::error file={path},line={ln},title=compile error::{msg}")
                  emitted += 1
              if len(errs) > 5:
                  print(f"::error file={path},title=more errors::{len(errs) - 5} more error(s) in this file are in the log artifact")
                  emitted += 1
          for t in list(dict.fromkeys(tests))[:40 - min(emitted, 40)]:
              print(f"::error title=test failure::{t.replace('%', '%25')[:400]}")
          summary = ["### Build errors", ""]
          for path, errs in by_file.items():
              summary.append(f"- `{path}` — {len(errs)} error(s)")
              for ln, msg in errs[:3]:
                  summary.append(f"  - L{ln}: {msg[:200]}")
          for t in list(dict.fromkeys(tests))[:10]:
              summary.append(f"- {t}")
          with open(__import__("os").environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write("\n".join(summary) + "\n")
          print(f"errors in {len(by_file)} file(s), {sum(len(v) for v in by_file.values())} total")
          PYEOF
      - name: Publish the raw build log to the ci-log branch
        # Runner logs and artifacts are not reachable from every environment, and the
        # Checks API caps annotations at 50 per run — so on failure the raw log is
        # pushed to an orphan branch. Read it with:
        #   gh api repos/<owner>/<repo>/contents/ci-build.log?ref=ci-log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LOG="$RUNNER_TEMP/build-output.log"
          [ -f "$LOG" ] || exit 0
          mkdir -p /tmp/logpub
          # JUnit XML carries the assertion text that gradle's plain console hides.
          python3 - > /tmp/logpub/tests.txt <<'PYEOF' || true
          import glob, os, xml.etree.ElementTree as ET
          root = os.environ.get("GITHUB_WORKSPACE", ".")
          files = glob.glob(os.path.join(root, "**/build/test-results/**/*.xml"), recursive=True)
          if not files:
              print("(no test-results xml found)")
          for f in files:
              try:
                  tree = ET.parse(f)
              except Exception as e:
                  print(f"# {f}: unreadable ({e})"); continue
              suite = tree.getroot()
              name = suite.get("name", os.path.basename(f))
              print(f"## {name}  tests={suite.get('tests')} failures={suite.get('failures')} errors={suite.get('errors')}")
              for tc in suite.iter("testcase"):
                  for tag in ("failure", "error"):
                      el = tc.find(tag)
                      if el is None:
                          continue
                      msg = (el.get("message") or "").strip().replace("\r", " ")
                      body = (el.text or "").strip().replace("\r", " ")
                      body = "\n".join(body.split("\n")[:14])
                      print(f"- FAIL `{tc.get('name')}`")
                      if msg:
                          print(f"  message: {msg[:400]}")
                      if body:
                          print(f"  ```\n{body}\n  ```")
          PYEOF
          {
            echo "# CI build log"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo
            cat /tmp/logpub/tests.txt
            echo
            grep -E '^e: |^> Task .* FAILED|FAILED$|\* What went wrong|^Caused by|error:' "$LOG" | head -400
            echo
            echo "## last 400 lines"
            echo '```'
            tail -400 "$LOG"
            echo '```'
          } > /tmp/logpub/ci-build.log
          cd /tmp/logpub
          git init -q -b ci-log
          git config user.name "ci-log"
          git config user.email "ci-log@users.noreply.github.com"
          git add ci-build.log
          git commit -qm "ci log ${GITHUB_SHA:0:7} [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-log

      - name: Upload build log and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-log-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-output.log
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect and upload the debug APK
        if: success()
        run: |
          mkdir -p ci-artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} ci-artifacts/ \;
          ls -lah ci-artifacts
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: NoveLA-ci-debug-${{ github.sha }}
          path: ci-artifacts/
          retention-days: 14
