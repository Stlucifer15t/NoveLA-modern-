name: CI

# Verification gate for the branch: compile every touched module, run the
# extension-compat unit tests (fatal — these are the tests that pin the index
# formats), then assemble a signed debug APK and keep it as an artifact.
#
# Debug builds are signed with keystore/novela-release.p12 (see keystore/README.md),
# so the artifact installs over a previous CI build instead of failing on
# INSTALL_FAILED_UPDATE_INCOMPATIBLE.

on:
  push:
    branches-ignore:
      - 'refs/tags/**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile + tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # A developer's org.gradle.java.home does not exist on the runner.
      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Check the signing key is present
        # Not fatal: a missing key only means unsigned/nightly-style output.
        run: |
          if [ -f keystore/novela-release.p12 ]; then
            echo "keystore: present"
            openssl pkcs12 -in keystore/novela-release.p12 -passin pass: -nokeys -noout -info
          else
            echo "keystore: MISSING — APK will fall back to the debug certificate"
          fi

      - name: Unit tests (extension compat layer)
        run: ./gradlew :tooling:extension_compat:testDebugUnitTest --stacktrace

      - name: Compile touched modules
        run: >
          ./gradlew
          :tooling:extension_compat:assembleDebug
          :features:extensions:assembleDebug
          :features:catalogExplorer:assembleDebug
          --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -20 || true

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect and upload the debug APK
        run: |
          mkdir -p ci-artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} ci-artifacts/ \;
          ls -lah ci-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: NoveLA-ci-debug-${{ github.sha }}
          path: ci-artifacts/
          retention-days: 14
