name: Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: false
        default: "default"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |FAILURE:|What went wrong:" -A 2 build.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=AssembleDebug::$line"
            done
            exit 1
          }
          echo "::notice title=AssembleDebug::Debug APK compiled and packaged cleanly."

      - name: Run UI & Engine Unit Tests
        run: |
          set -o pipefail
          ./gradlew \
            :coreui:testDebugUnitTest \
            :features:chaptersList:testDebugUnitTest \
            :features:libraryExplorer:testDebugUnitTest \
            :features:reader:testDebugUnitTest \
            :features:sourceExplorer:testDebugUnitTest \
            :features:webview:testDebugUnitTest \
            :scraper:testDebugUnitTest \
            :networking:testDebugUnitTest \
            :tooling:epub_parser:testDebugUnitTest \
            :tooling:text_to_speech:testDebugUnitTest \
            --stacktrace 2>&1 | tee test.log || {
            grep -E "FAILED|^e: |AssertionError|ComparisonFailure" -B 1 -A 2 test.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=UnitTests::$line"
            done
            exit 1
          }
          echo "::notice title=UnitTests::All UI and core engine JUnit test suites passed."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novela-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
