name: Build & Publish

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'test'
        type: choice
        options:
          - test      # Upload artifact only, no release
          - release   # Create a draft GitHub Release

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup APK signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          CLEAN_KEY="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          if [ -n "$CLEAN_KEY" ]; then
            echo "Using repository SIGNING_KEY secret..."
            printf '%s' "$CLEAN_KEY" | base64 -d > app/storeFile.jks
            STORE_PASS="${KEY_STORE_PASSWORD}"
            KEY_ALIAS="${ALIAS:-novela}"
            KEY_PASS="${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"
          else
            echo "SIGNING_KEY secret not set; generating fallback PKCS12 keystore..."
            STORE_PASS="novela_ci_keystore"
            KEY_ALIAS="novela"
            KEY_PASS="novela_ci_keystore"
            keytool -genkeypair -v \
              -keystore app/storeFile.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=NoveLA, OU=Android, O=NoveLA, L=Lagos, ST=Lagos, C=NG"
          fi
          {
            echo "storeFile=storeFile.jks"
            echo "storePassword=${STORE_PASS}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASS}"
          } > custom.properties

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Build release APK
        run: ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties

      - name: Set app version
        run: |
          echo "APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Collect APKs
        env:
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' \
            -exec cp {} release-artifacts/ \;
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "release-artifacts/mapping-${SHORT_SHA}.txt.gz"
          fi
          ls -lah release-artifacts

      # ── Test build: upload as workflow artifact (no release) ────────────────
      - name: Upload APK artifact (test build)
        if: inputs.build_type == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: NoveLA-v${{ env.APP_VERSION }}-test
          path: release-artifacts/
          retention-days: 14

      # ── Release build: create a draft GitHub Release ─────────────────────────
      - name: Create draft release
        if: inputs.build_type == 'release'
        uses: softprops/action-gh-release@v3
        with:
          name: NoveLA v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          draft: true
          body: |
            # <img src="https://github.com/HnDK0/NoveLA/raw/default/screenshots/NoveLA.png" width="36" valign="middle"> NoveLA — Light Novel Reader & Parser
            <details>
            <summary><b>🇷🇺 Russian Version</b></summary>
            ### [КАТЕГОРИЯ]
            - [ОПИСАНИЕ ИЗМЕНЕНИЯ]
            </details>
            <details open>
            <summary><b>🇺🇸 English Version</b></summary>
            ### [CATEGORY]
            - [CHANGE DESCRIPTION]
            </details>
            ## Screenshots
            [ССЫЛКИ НА ИЗОБРАЖЕНИЯ]
          files: release-artifacts/*
