name: XPath probe

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f6d200f0-novela-modern
    paths:
      - .github/workflows/xpath-probe.yml

permissions:
  contents: write

jobs:
  probe:
    name: Jsoup XPath behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the probe
        run: |
          set -e
          curl -sSfL -o /tmp/jsoup.jar https://repo1.maven.org/maven2/org/jsoup/jsoup/1.23.1/jsoup-1.23.1.jar
          mkdir -p /tmp/probe
          cat > /tmp/probe/p.jsh <<'JSH'
          import org.jsoup.Jsoup;
          import org.jsoup.helper.W3CDom;
          import org.jsoup.parser.Parser;
          import org.w3c.dom.Document;
          import org.w3c.dom.Node;
          import org.w3c.dom.NodeList;
          import javax.xml.xpath.XPathConstants;
          import javax.xml.xpath.XPathFactory;
          import javax.xml.transform.TransformerFactory;
          import javax.xml.transform.dom.DOMSource;
          import javax.xml.transform.stream.StreamResult;
          import java.io.StringWriter;

          String html = "<html><body><ul id=\"chapter-list\"><li><a href=\"/c/1\">Chapter 1</a></li><li>x</li><li>y</li></ul></body></html>";
          String xp = "//ul[@id='chapter-list']/li";

          void dump(String label, Document w3c, String expr) {
            try {
              StringBuilder names = new StringBuilder();
              NodeList all = w3c.getElementsByTagName("*");
              for (int i = 0; i < Math.min(all.getLength(), 8); i++) names.append(all.item(i).getNodeName()).append(" ");
              System.out.println(label + " NAMES: " + names);
              Object r = XPathFactory.newInstance().newXPath().evaluate(expr, w3c, XPathConstants.NODESET);
              NodeList nl = (NodeList) r;
              System.out.println(label + " XPATH(" + expr + ") = " + nl.getLength());
              StringWriter sw = new StringWriter();
              TransformerFactory.newInstance().newTransformer().transform(new DOMSource(w3c), new StreamResult(sw));
              String xml = sw.toString().replaceAll("\\s+", " ");
              System.out.println(label + " XML: " + xml.substring(0, Math.min(xml.length(), 300)));
            } catch (Exception e) {
              System.out.println(label + " EXC: " + e);
            }
          }

          Document a = new W3CDom().fromJsoup(Jsoup.parse(html));
          dump("html-parser", a, xp);
          dump("html-parser-count", a, "//li");

          Document b = new W3CDom().fromJsoup(Jsoup.parse(html));
          NodeList all = b.getElementsByTagName("*");
          for (int i = 0; i < all.getLength(); i++) {
            Node n = all.item(i);
            String nm = n.getNodeName();
            int c = nm.indexOf(':');
            if (c > 0) {
              try { b.renameNode(n, null, nm.substring(c + 1)); } catch (Exception e) { System.out.println("rename EXC @ " + nm + ": " + e); break; }
            }
          }
          dump("html+rename", b, xp);

          Document c2 = new W3CDom().fromJsoup(Jsoup.parse(html, "", Parser.xmlParser()));
          dump("xml-parser", c2, xp);
          /exit
          JSH
          jshell --class-path /tmp/jsoup.jar -q /tmp/probe/p.jsh > /tmp/probe/out.txt 2>&1 || true
          cat /tmp/probe/out.txt
      - name: Publish the probe result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logpub && cd /tmp/logpub
          git init -q -b ci-log
          git config user.name probe && git config user.email probe@users.noreply.github.com
          { echo "# XPath probe"; echo '```'; cat /tmp/probe/out.txt; echo '```'; } > ci-build.log
          git add -A && git commit -qm "xpath probe [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-log
