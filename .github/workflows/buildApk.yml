name: Build Signed APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
      - 'master'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  pull_request:
    branches:
      - default
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Signed Release & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Setup APK signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          CLEAN_KEY="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          if [ -n "$CLEAN_KEY" ]; then
            echo "Using repository SIGNING_KEY secret..."
            printf '%s' "$CLEAN_KEY" | base64 -d > app/storeFile.jks
            STORE_PASS="${KEY_STORE_PASSWORD}"
            KEY_ALIAS="${ALIAS:-novela}"
            KEY_PASS="${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"
          else
            echo "SIGNING_KEY secret not set; generating fallback PKCS12 keystore..."
            STORE_PASS="novela_ci_keystore"
            KEY_ALIAS="novela"
            KEY_PASS="novela_ci_keystore"
            keytool -genkeypair -v \
              -keystore app/storeFile.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=NoveLA, OU=Android, O=NoveLA, L=Lagos, ST=Lagos, C=NG"
          fi
          {
            echo "storeFile=storeFile.jks"
            echo "storePassword=${STORE_PASS}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASS}"
          } > custom.properties

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --continue 2>&1 | tee debug-build.log; then
            python3 - <<'PY'
          import pathlib
          lines = pathlib.Path("debug-build.log").read_text(errors="replace").splitlines()
          out = [l for l in lines if l.startswith("e: ") or l.endswith(" FAILED")]
          for i, l in enumerate(lines):
              if "What went wrong:" in l:
                  out.extend(lines[i:i+30])
                  break
          if not out:
              out = lines[-40:]
          msg = "\n".join(out[:80]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=DebugBuildFailure::{msg}")
          PY
            exit 1
          fi

      - name: Assemble Signed Release APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties 2>&1 | tee release-build.log; then
            python3 - <<'PY'
          import pathlib
          lines = pathlib.Path("release-build.log").read_text(errors="replace").splitlines()
          out = [l for l in lines if l.startswith("e: ") or l.endswith(" FAILED") or "Missing class" in l]
          for i, l in enumerate(lines):
              if "What went wrong:" in l:
                  out.extend(lines[i:i+35])
                  break
          if not out:
              out = lines[-40:]
          msg = "\n".join(out[:80]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=ReleaseBuildFailure::{msg}")
          PY
            exit 1
          fi

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Collect APKs
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} release-artifacts/ \;
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "release-artifacts/mapping-${SHORT_SHA}.txt.gz"
          fi
          ls -lah release-artifacts

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: NoveLA-APK-${{ github.sha }}
          path: release-artifacts/
          retention-days: 30
